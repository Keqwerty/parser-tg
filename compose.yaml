services:
  parser:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - parser-data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    healthcheck:
      test: ["CMD", "parser-tg", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m

volumes:
  parser-data:
