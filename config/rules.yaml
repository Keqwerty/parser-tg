      - "процессор"
      - "проц"
      - "cpu"
      - "ryzen"
      - "threadripper"
      - "athlon"
      - "amd epyc"
      - "intel core"
      - "core ultra"
      - "xeon"
    fuzzy_threshold: 90
    exclude: []

  # DDR4: любой бренд, но только комплекты 2x8 или 2x16.
  - id: ram_ddr4_kits
    aliases:
      - "ddr4"
      - "ddr 4"
    require_any:
      - "2x8"
      - "2 x 8"
      - "2×8"
      - "2 по 8"
      - "2x16"
      - "2 x 16"
      - "2×16"
      - "2 по 16"
    fuzzy_threshold: 90
    exclude: []

  - id: ram_ddr5_brands
