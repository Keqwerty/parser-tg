version: 1

# Замените примеры на публичные username или числовые ID каналов.
sources:
  - "@megairon"
  - "@pepperru"
  - "@sale_prossd"
  - "@hotprice"
  - "@CoffeaTee"
  - "@rx9070"
  - -1004435726347

