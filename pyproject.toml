[project]
name = "parser-tg"
version = "0.1.0"
description = "Resource-efficient Telegram channel filter and forwarder"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pyyaml>=6.0.2,<7",
    "rapidfuzz>=3.14.0,<4",
    "telethon>=1.44.0,<2",
]

[project.scripts]
parser-tg = "parser_tg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser_tg"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
